# English version of this profile (replaces the Portuguese fields on the English site).
role: Undergraduate research fellow (CNPq)
bio: Undergraduate student in Biological Sciences (teaching and bachelor's degrees) at UNESP, Ilha Solteira campus, and CNPq undergraduate research fellow. He works at the Plant Metabolism Physiology Laboratory (LFMV) and collaborates on the studies of phosphate fertilization for seedling production and flower induction in mini roses (Rosa sp.).
