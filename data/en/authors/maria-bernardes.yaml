# English version of this profile (replaces the Portuguese fields on the English site).
role: Biologist
bio: Graduated in Biological Sciences (teaching and bachelor's degrees) from UNESP, Ilha Solteira campus. She was a COPE Conecta fellow in the FEIS Tree Inventory extension project, with emphasis on Botany, and a FAPESP fellow in Molecular Genetics of livestock. Her undergraduate thesis studied the effect of temperature on juvenile Brycon orbignyanus, with kidney histology and analysis of genes associated with heat stress.
