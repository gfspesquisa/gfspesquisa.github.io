# English version of this profile (replaces the Portuguese fields on the English site).
role: PhD student in Plant Protection
bio: Agronomist from Centro Universitário Católico Salesiano Auxilium, with an MSc and currently a PhD student in Plant Protection at the School of Agricultural Sciences (FCA/UNESP), Botucatu. She is a member of the Laboratory of Plant Virology and Virus-Vector-Plant Interaction (LAVIV), with experience in plant pathology focused on plant virology and molecular biology. She collaborates on the studies of the antifungal activity of silver-doped materials against Fusarium verticillioides.
user_groups:
