# English version of this profile (replaces the Portuguese fields on the English site).
role: Supervisor
bio: Associate professor at the School of Engineering of Ilha Solteira (FEIS/UNESP), Department of Plant Protection, Rural Engineering and Soils, and CNPq research productivity fellow. He works in plant pathology, with emphasis on the genetics and evolution of plant pathogens, epidemiology and fungicide resistance, including environmental antifungal resistance in Aspergillus fumigatus from a One Health perspective. He supervises Gabriel in One Health research, such as the activity of red propolis against azole-resistant Aspergillus fumigatus, and with him Gabriel helped organize the Brazilian Network Meeting on Antimicrobial Resistance in Aspergillus fumigatus, held at FCA/UNESP in Botucatu in December 2025.
