role: Supervisor
bio: Associate professor at the School of Engineering of Ilha Solteira (FEIS/UNESP), Department of Plant Protection, Rural Engineering and Soils, and CNPq research productivity fellow. He works in plant pathology, with emphasis on the genetics and evolution of plant pathogens, epidemiology and fungicide resistance, including environmental antifungal resistance in Aspergillus fumigatus from a One Health perspective.
