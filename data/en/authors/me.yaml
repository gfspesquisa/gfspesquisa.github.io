role: Undergraduate Student in Agronomic Engineering
bio: 'I am an undergraduate student in Agronomic Engineering at the School of Engineering of Ilha Solteira (FEIS/UNESP), Brazil. My research aims to understand how fungi and other microorganisms can contribute to more sustainable agriculture: from the use of spent mushroom substrate as a biofertilizer to microbial bio-inputs and natural compounds with antifungal properties. I take part in projects with national and international collaborators, with support from CNPq and UK Research and Innovation.'
