role: Agronomy Undergraduate
bio: 'I am an Agronomy undergraduate at the School of Engineering of Ilha Solteira (FEIS/UNESP), Brazil. I work in mycology, plant pathology and soil microbiology from a One Health perspective, which connects the health of plants, people and the environment. My research covers the bioprospecting of microorganisms to control plant pathogens, the use of biomaterials and natural products against plant pathogenic fungi, and the reuse of mushroom-farming residues as bio-inputs. I take part in projects with national and international collaborators, with support from CNPq and UK Research and Innovation.'
