# English version of this profile (replaces the Portuguese fields on the English site).
role: MSc student in Agronomy (Plant Pathology)
bio: MSc student in Agronomy (Plant Pathology) in the Graduate Program in Agronomy at UNESP Ilha Solteira, Department of Plant Protection, Rural Engineering and Soils (DEFERS). He researches plant virology, focusing on RNA interference (dsRNA) for pathogen control, supervised by Prof. Dr. Gabriel Madoglio Favara. He holds a degree in Biological Sciences (bachelor's and teaching) from FEIS/UNESP. He collaborates on the studies of the antifungal activity of silver-doped materials against Fusarium verticillioides.
