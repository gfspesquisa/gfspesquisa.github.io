# English version of this profile (replaces the Portuguese fields on the English site).
role: Postdoctoral researcher
bio: Agronomist and PhD in Soil Science from the School of Agricultural and Veterinary Sciences (FCAV/UNESP), Jaboticabal. He is a postdoctoral researcher at the School of Engineering of Ilha Solteira (FEIS/UNESP), with experience in soil health and microbiology, focusing on arbuscular mycorrhizal fungi, plant growth-promoting bacteria, organic fertilization, tropical agriculture and recovery of degraded areas. He is a co-author of the studies on spent Pleurotus ostreatus substrate and on microbial consortia for seedling production.
