# English version of this profile (replaces the Portuguese fields on the English site).
role: Supervisor
bio: Professor at the School of Engineering of Ilha Solteira (FEIS/UNESP), Department of Physics and Chemistry. She works on the development of biomaterials and polymeric materials, such as cellulose nanocomposites, poly(ε-caprolactone) films and electrospun membranes, and the use of propolis residues in bioactive materials. She supervises Gabriel's work on biomaterials and natural products against plant-pathogenic fungi, such as silver-doped dolomite and Alagoas red propolis.
user_groups:
  - Supervision
interests:
  - Biomaterials
  - Polymers and nanocomposites
  - Propolis and bioactive materials
