# English version of this profile (replaces the Portuguese fields on the English site).
role: Supervisor
bio: Researcher at the School of Engineering of Ilha Solteira (FEIS/UNESP) in Agronomy. She works on cover crops, soil biological fertility, no-tillage systems in the Cerrado and silicate soil amendments. She supervises Gabriel's work on phosphate fertilization for seedling production and flower induction in mini roses (Rosa sp.).
