# English version of this profile (replaces the Portuguese fields on the English site).
role: Supervisor
bio: Assistant professor at the School of Engineering of Ilha Solteira (FEIS/UNESP). She holds a degree in Agronomy from UNESP Ilha Solteira, an MSc and PhD in Agronomy from UNESP Botucatu, with a sandwich doctorate at the University of New England (Australia), and a postdoctorate from UNESP. She works on soil fertility, fertilization, use of residues in agriculture and silicon in soil, and is a member of the Silicon in the Soil-Plant System research group (SisPlant). She supervises Gabriel's work on phosphate fertilization for seedling production and flower induction in mini roses (Rosa sp.).
