# English version of this profile (replaces the Portuguese fields on the English site).
role: Undergraduate research fellow (CNPq)
bio: Undergraduate student in Biological Sciences (teaching and bachelor's degrees) at UNESP, School of Engineering of Ilha Solteira (FEIS), since 2023, and CNPq undergraduate research fellow. At the Plant Physiology and Metabolism Laboratory (LFMV), she researches phytoremediation, investigating the potential of plant species to remediate soils contaminated by metals, with emphasis on boron and copper. She collaborates on the studies of phosphate fertilization for seedling production and flower induction in mini roses (Rosa sp.).
user_groups:
  - Collaborators
interests:
  - Plant physiology
  - Phytoremediation
  - Plant stress tolerance
