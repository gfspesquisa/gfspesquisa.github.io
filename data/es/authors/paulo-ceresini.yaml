role: Orientador
bio: Profesor asociado de la Facultad de Ingeniería de Ilha Solteira (FEIS/UNESP), en el Departamento de Fitosanidad, Ingeniería Rural y Suelos, y becario de productividad en investigación del CNPq. Trabaja en fitopatología, con énfasis en la genética y evolución de fitopatógenos, la epidemiología y la resistencia a fungicidas, incluida la resistencia antifúngica ambiental en Aspergillus fumigatus desde la perspectiva de Una Salud.
