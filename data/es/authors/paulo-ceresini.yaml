# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Orientador
bio: Profesor asociado de la Facultad de Ingeniería de Ilha Solteira (FEIS/UNESP), en el Departamento de Fitosanidad, Ingeniería Rural y Suelos, y becario de productividad en investigación del CNPq. Trabaja en fitopatología, con énfasis en la genética y evolución de fitopatógenos, la epidemiología y la resistencia a fungicidas, incluida la resistencia antifúngica ambiental en Aspergillus fumigatus desde la perspectiva de Una Salud. Orienta a Gabriel en investigaciones de Una Salud, como la acción del propóleo rojo contra Aspergillus fumigatus resistente a los azoles, y con él Gabriel colaboró en la organización del Encuentro de la Red Brasileña sobre Resistencia Antimicrobiana en Aspergillus fumigatus, realizado en la FCA/UNESP, en Botucatu, en diciembre de 2025.
