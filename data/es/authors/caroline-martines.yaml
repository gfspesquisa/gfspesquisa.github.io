# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Doctoranda en Protección de Plantas
bio: Ingeniera agrónoma por el Centro Universitário Católico Salesiano Auxilium, magíster y doctoranda en Protección de Plantas por la Facultad de Ciencias Agronómicas (FCA/UNESP), en Botucatu. Es miembro del Laboratorio de Virología Vegetal e Interacción Virus-Vector-Planta (LAVIV) y tiene experiencia en fitopatología, con énfasis en virología vegetal y biología molecular. Colabora en los trabajos sobre la actividad antifúngica de materiales dopados con plata contra Fusarium verticillioides.
user_groups:
