# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Orientadora
bio: Profesora de la Facultad de Ingeniería de Ilha Solteira (FEIS/UNESP), en el Departamento de Física y Química. Trabaja en el desarrollo de biomateriales y materiales poliméricos, como nanocompuestos de celulosa, películas y membranas electrohiladas de poli(ε-caprolactona) y el aprovechamiento de residuos de propóleo en materiales bioactivos. Orienta a Gabriel en los trabajos con biomateriales y productos naturales contra hongos fitopatógenos, como la dolomita dopada con plata y el propóleo rojo de Alagoas.
user_groups:
  - Orientación
interests:
  - Biomateriales
  - Polímeros y nanocompuestos
  - Propóleo y materiales bioactivos
