role: Orientador
bio: Profesor de la Facultad de Ingeniería de Ilha Solteira (FEIS/UNESP), en el Departamento de Fitosanidad, Ingeniería Rural y Suelos, y doctor en Agronomía por la Universidad de São Paulo. Trabaja en fitosanidad, con investigaciones sobre virus de plantas transmitidos por moscas blancas, endosimbiontes de insectos y ARN de interferencia para el control de plagas. Orienta a Gabriel en los trabajos sobre la actividad antifúngica de materiales dopados con plata contra Fusarium verticillioides.
