# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Estudiante de maestría en Agronomía (Fitopatología)
bio: Estudiante de maestría en Agronomía (Fitopatología) en el Programa de Posgrado en Agronomía de la UNESP Ilha Solteira, en el Departamento de Fitosanidad, Ingeniería Rural y Suelos (DEFERS). Investiga virología vegetal, con foco en el uso de ARN de interferencia (dsRNA) para el control de patógenos, bajo la orientación del Prof. Dr. Gabriel Madoglio Favara. Graduado en Ciencias Biológicas (bachillerato y licenciatura) por la FEIS/UNESP. Colabora en los trabajos sobre la actividad antifúngica de materiales dopados con plata contra Fusarium verticillioides.
user_groups:
