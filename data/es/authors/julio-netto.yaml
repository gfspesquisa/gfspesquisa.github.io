role: Becario de Iniciación Científica (CNPq)
bio: Estudiante de Ciencias Biológicas (licenciatura y bachillerato) en la UNESP, campus de Ilha Solteira, y becario de Iniciación Científica del CNPq. Realiza actividades en el Laboratorio de Fisiología del Metabolismo Vegetal (LFMV) y colabora en los trabajos sobre fertilización fosfatada en la producción de plántulas y en la inducción floral de minirrosal (Rosa sp.).
