# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Becaria de Iniciación Científica (CNPq)
bio: Estudiante de Ciencias Biológicas (licenciatura y bachillerato) en la UNESP, Facultad de Ingeniería de Ilha Solteira (FEIS), desde 2023, y becaria de Iniciación Científica del CNPq. En el Laboratorio de Fisiología y Metabolismo Vegetal (LFMV) investiga la fitorremediación, estudiando el potencial de especies vegetales para remediar suelos contaminados por metales, con énfasis en el boro y el cobre. Colabora en los trabajos sobre fertilización fosfatada en la producción de plántulas y en la inducción floral de minirrosal (Rosa sp.).
user_groups:
  - Colaboradores
interests:
  - Fisiología vegetal
  - Fitorremediación
  - Tolerancia de las plantas al estrés
