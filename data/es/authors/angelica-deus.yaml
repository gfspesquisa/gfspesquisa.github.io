# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Orientadora
bio: Investigadora de la Facultad de Ingeniería de Ilha Solteira (FEIS/UNESP) en el área de Agronomía. Trabaja con cultivos de cobertura, fertilidad biológica del suelo, siembra directa en el Cerrado y correctivos silicatados. Orienta a Gabriel en los trabajos sobre fertilización fosfatada en la producción de plántulas y en la inducción floral de minirrosal (Rosa sp.).
