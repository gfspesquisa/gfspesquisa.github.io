# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Orientadora
bio: Profesora asistente doctora de la Facultad de Ingeniería de Ilha Solteira (FEIS/UNESP). Ingeniera agrónoma por la UNESP Ilha Solteira, con maestría y doctorado en Agronomía por la UNESP Botucatu, doctorado sándwich en la University of New England (Australia) y posdoctorado por la UNESP. Trabaja en fertilidad del suelo, fertilización, uso de residuos en la agricultura y silicio en el suelo, y es miembro del grupo de investigación Silicio en el Sistema Suelo-Planta (SisPlant). Orienta a Gabriel en los trabajos sobre fertilización fosfatada en la producción de plántulas y en la inducción floral de minirrosal (Rosa sp.).
