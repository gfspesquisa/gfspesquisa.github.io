role: Estudiante de Ingeniería Agronómica
bio: 'Soy estudiante de Ingeniería Agronómica en la Facultad de Ingeniería de Ilha Solteira (FEIS/UNESP), Brasil. Mi investigación busca entender cómo los hongos y otros microorganismos pueden contribuir a una agricultura más sostenible: desde el aprovechamiento del sustrato poscultivo de hongos comestibles como biofertilizante hasta bioinsumos microbianos y compuestos naturales con acción antifúngica. Participo en proyectos con colaboradores nacionales e internacionales, con apoyo del CNPq y de UK Research and Innovation.'
