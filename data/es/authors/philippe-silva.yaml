# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Investigador posdoctoral
bio: Ingeniero agrónomo y doctor en Ciencia del Suelo por la Facultad de Ciencias Agrarias y Veterinarias (FCAV/UNESP), en Jaboticabal. Realiza investigación posdoctoral en la Facultad de Ingeniería de Ilha Solteira (FEIS/UNESP), con experiencia en salud y microbiología del suelo, con énfasis en hongos micorrícicos arbusculares, bacterias promotoras del crecimiento vegetal, fertilización orgánica, agricultura tropical y recuperación de áreas degradadas. Es coautor de los trabajos sobre el compost agotado de Pleurotus ostreatus y sobre consorcios microbianos en la producción de plántulas.
