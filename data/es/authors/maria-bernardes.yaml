# Versión en español de este perfil (reemplaza los campos en portugués en el sitio en español).
role: Bióloga
bio: Graduada en Ciencias Biológicas (licenciatura y bachillerato) por la UNESP, campus de Ilha Solteira. Fue becaria del programa COPE Conecta en el proyecto de extensión Inventario Arbóreo de la FEIS, con énfasis en Botánica, y becaria de la FAPESP en Genética Molecular de animales de producción. En su trabajo de fin de grado estudió el efecto de la temperatura en juveniles de Brycon orbignyanus, con análisis histológicos de los riñones y de genes asociados al estrés térmico.
