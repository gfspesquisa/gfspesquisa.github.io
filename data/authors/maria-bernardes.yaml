bio: Formada em Ciências Biológicas (licenciatura e bacharelado) pela UNESP, câmpus de Ilha Solteira. Foi bolsista do programa COPE Conecta no projeto de extensão Inventário Arbóreo da FEIS, com ênfase em Botânica, e bolsista da FAPESP em Genética Molecular de animais de produção. No trabalho de conclusão de curso, estudou o efeito da temperatura em juvenis de Brycon orbignyanus, com análises histológicas dos rins e de genes associados ao estresse térmico.
