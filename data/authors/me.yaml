bio: 'I am an undergraduate student in Agricultural Engineering at the Ilha Solteira School of Engineering (FEIS/UNESP). My research aims to understand how fungi and other microorganisms can contribute to more sustainable agriculture: from the use of post-cultivation mushroom substrate as a biofertilizer to microbial bio-inputs and natural compounds with antifungal properties. I participate in projects with national and international collaborators, with support from CNPq and UK Research and Innovation.'
