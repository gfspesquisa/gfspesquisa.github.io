bio: |-
  Sou graduando em Engenharia Agronômica na Faculdade de Engenharia de Ilha Solteira
  (FEIS/UNESP). Minha pesquisa busca entender como fungos e outros micro-organismos podem
  ser aliados de uma agricultura mais sustentável: do aproveitamento do substrato pós-cultivo
  de cogumelos como biofertilizante a bioinsumos microbianos e compostos naturais com ação
  antifúngica. Participo de projetos com colaboradores nacionais e internacionais, com apoio
  do CNPq e da UK Research and Innovation.
