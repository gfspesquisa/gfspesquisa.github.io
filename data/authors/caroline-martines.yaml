bio: Engenheira agrônoma pelo Centro Universitário Católico Salesiano Auxilium, mestre e doutoranda em Proteção de Plantas pela Faculdade de Ciências Agronômicas (FCA/UNESP), em Botucatu. É membro do Laboratório de Virologia Vegetal e Interação Vírus-Vetor-Planta (LAVIV) e tem experiência em fitopatologia, com ênfase em virologia vegetal e biologia molecular. Colabora nos trabalhos sobre a atividade antifúngica de materiais dopados com prata contra Fusarium verticillioides.
