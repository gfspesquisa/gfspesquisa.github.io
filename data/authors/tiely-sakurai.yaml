role: Bolsista de Iniciação Científica (CNPq)
bio: Graduanda em Ciências Biológicas (licenciatura e bacharelado) na UNESP, Faculdade de Engenharia de Ilha Solteira (FEIS), desde 2023, e bolsista de Iniciação Científica do CNPq. No Laboratório de Fisiologia e Metabolismo Vegetal (LFMV), pesquisa fitorremediação, investigando o potencial de espécies vegetais na remediação de solos contaminados por metais, com ênfase no boro e no cobre. Colabora nos trabalhos sobre adubação fosfatada na produção de mudas e na indução floral de mini-roseira (Rosa sp.).
