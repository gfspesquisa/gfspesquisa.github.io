bio: Engenheiro agrônomo e doutor em Ciência do Solo pela Faculdade de Ciências Agrárias e Veterinárias (FCAV/UNESP), em Jaboticabal. Desenvolve pesquisa de pós-doutorado na Faculdade de Engenharia de Ilha Solteira (FEIS/UNESP). Tem experiência em saúde e microbiologia do solo, com ênfase em fungos micorrízicos arbusculares, bactérias promotoras de crescimento vegetal, adubação orgânica, agricultura tropical e recuperação de áreas degradadas. É coautor dos trabalhos sobre o composto exaurido de Pleurotus ostreatus e sobre consórcios microbianos na produção de mudas.
