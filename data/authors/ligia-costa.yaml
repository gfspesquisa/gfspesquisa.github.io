bio: Professora da Faculdade de Engenharia de Ilha Solteira (FEIS/UNESP), no Departamento de Física e Química. Atua no desenvolvimento de biomateriais e materiais poliméricos, como nanocompósitos de celulose, filmes e membranas eletrofiadas de poli(ε-caprolactona) e o aproveitamento de resíduos de própolis em materiais bioativos. Orienta Gabriel nos trabalhos com biomateriais e produtos naturais contra fungos fitopatogênicos, como a dolomita dopada com prata e a própolis vermelha de Alagoas.
