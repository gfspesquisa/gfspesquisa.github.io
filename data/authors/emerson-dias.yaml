bio: Mestrando em Agronomia (Fitopatologia) no Programa de Pós-Graduação em Agronomia da UNESP Ilha Solteira, no Departamento de Fitossanidade, Engenharia Rural e Solos (DEFERS). Pesquisa virologia vegetal, com foco no uso de RNA de interferência (dsRNA) no controle de patógenos, sob orientação do Prof. Dr. Gabriel Madoglio Favara. Graduado em Ciências Biológicas (bacharelado e licenciatura) pela FEIS/UNESP. Colabora nos trabalhos sobre a atividade antifúngica de materiais dopados com prata contra Fusarium verticillioides.
