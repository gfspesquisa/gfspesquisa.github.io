bio: Professor associado da Faculdade de Engenharia de Ilha Solteira (FEIS/UNESP), no Departamento de Fitossanidade, Engenharia Rural e Solos, e bolsista de produtividade em pesquisa do CNPq. Atua em fitopatologia, com ênfase na genética e evolução de fitopatógenos, epidemiologia e resistência a fungicidas, incluindo a resistência antifúngica ambiental em Aspergillus fumigatus sob a perspectiva da Saúde Única. Orienta Gabriel nos trabalhos de Saúde Única, como a ação da própolis vermelha contra Aspergillus fumigatus resistente a azóis, e com ele Gabriel colaborou na organização do Encontro da Rede Brasileira sobre Resistência Antimicrobiana em Aspergillus fumigatus, realizado na FCA/UNESP, em Botucatu, em dezembro de 2025.
