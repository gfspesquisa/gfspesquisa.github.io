bio: Professora assistente doutora da Faculdade de Engenharia de Ilha Solteira (FEIS/UNESP). Engenheira agrônoma pela UNESP Ilha Solteira, com mestrado e doutorado em Agronomia pela UNESP Botucatu, doutorado-sanduíche na University of New England (Austrália) e pós-doutorado pela UNESP. Atua em fertilidade do solo, adubação, uso de resíduos na agricultura e silício no solo, e é membro do grupo de pesquisa Silício no Sistema Solo-Planta (SisPlant). Orienta Gabriel nos trabalhos sobre adubação fosfatada na produção de mudas e na indução floral de mini-roseira (Rosa sp.).
