# ════════════════════════════════════════════════════════════════════
# PAINEL DE EDIÇÃO (Sveltia CMS) — acesse em SEU-SITE/admin/
# Só consegue salvar quem for colaborador do repositório no GitHub.
# ════════════════════════════════════════════════════════════════════

backend:
  name: github
  repo: gfspesquisa/gfspesquisa.github.io
  branch: main
  # Opcional: botão "Entrar com GitHub" (sem token). Veja o passo 7 do LEIA-ME.
  # base_url: https://sveltia-cms-auth.gfspesquisa.workers.dev

# Onde ficam as imagens enviadas pelo painel (quando não ficam junto da página)
media_folder: static/uploads
public_folder: /uploads

output:
  omit_empty_optional_fields: true   # não grava campos opcionais vazios

# Nomes de pastas sem acentos nem símbolos (evita erros no Windows)
slug:
  encoding: ascii
  clean_accents: true

# Três idiomas: português (padrão, index.md), inglês (index.en.md) e espanhol (index.es.md)
i18n:
  structure: multiple_files
  locales: [pt, en, es]
  default_locale: pt
  omit_default_locale_from_file_path: true

collections:

  # ──────────────────────────────────────────────────────────────────
  # PUBLICAÇÕES — ficam no idioma original. O painel copia tudo
  # automaticamente para as versões em inglês e espanhol (campos "duplicate").
  - name: publicacoes
    label: Publicações
    label_singular: Publicação
    description: Resumos em congressos, artigos, capítulos e demais trabalhos (no idioma original; aparecem nas três versões do site).
    folder: content/publications
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    i18n: true
    slug: '{{year}}-{{slug}}'
    summary: '{{date | date("YYYY")}} — {{title}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Título, widget: string, i18n: duplicate }
      - name: authors
        label: Autores (na ordem da publicação)
        hint: Escreva "me" para você mesmo (puxa o seu perfil). Os demais, pelo nome.
        widget: list
        default: [me]
        i18n: duplicate
        field: { name: autor, label: Autor, widget: string }
      - { name: date, label: Data da publicação, widget: datetime, type: date, format: 'YYYY-MM-DD', i18n: duplicate }
      - name: publication_types
        label: Tipo
        widget: select
        multiple: true
        max: 1
        default: [paper-conference]
        i18n: duplicate
        options:
          - { label: Trabalho/resumo em evento, value: paper-conference }
          - { label: Artigo em periódico, value: article-journal }
          - { label: Capítulo de livro, value: chapter }
          - { label: Livro, value: book }
          - { label: Relatório técnico, value: report }
          - { label: 'Tese, dissertação ou TCC', value: thesis }
          - { label: Preprint, value: article }
          - { label: Patente, value: patent }
      - name: publication
        label: Onde foi publicado
        widget: object
        i18n: duplicate
        fields:
          - { name: name, label: Nome do evento ou da revista, widget: string }
          - { name: volume, label: Volume, widget: string, required: false }
          - { name: issue, label: Número, widget: string, required: false }
          - { name: pages, label: Páginas, widget: string, required: false }
      - name: hugoblox
        label: Identificadores
        widget: object
        required: false
        collapsed: true
        i18n: duplicate
        fields:
          - name: ids
            label: Identificadores
            widget: object
            required: false
            fields:
              - { name: doi, label: DOI, hint: 'Somente o código, ex.: 10.1234/abcd.2026.001 (sem https://doi.org/). Gera o botão DOI.', widget: string, required: false }
      - name: links
        label: Links para a fonte original
        hint: Só adicione links com endereço preenchido.
        widget: list
        required: false
        i18n: duplicate
        summary: '{{fields.type}} — {{fields.url}}'
        fields:
          - name: type
            label: Tipo de link
            widget: select
            default: source
            options:
              - { label: Página original / anais, value: source }
              - { label: PDF, value: pdf }
              - { label: Pôster, value: poster }
              - { label: Slides, value: slides }
              - { label: Dados, value: dataset }
              - { label: Código, value: code }
              - { label: Vídeo, value: video }
          - { name: url, label: Endereço (URL), widget: string, type: url }
      - { name: abstract, label: Resumo, widget: text, required: false, i18n: duplicate }
      - { name: summary, label: Frase curta (aparece nas listas), widget: string, required: false, i18n: duplicate }
      - { name: tags, label: Palavras-chave, widget: list, required: false, i18n: duplicate }
      - { name: featured, label: Destacar na página inicial, widget: boolean, default: false, i18n: duplicate }
      - { name: peer_reviewed, label: Revisado por pares, widget: boolean, default: true, i18n: duplicate }
      - { name: open_access, label: Acesso aberto, widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Notas adicionais e imagens (opcional), widget: markdown, required: false, i18n: duplicate }

  # ──────────────────────────────────────────────────────────────────
  # PESQUISA — textos traduzíveis (PT, EN e ES lado a lado no painel)
  - name: pesquisa
    label: Pesquisa (projetos)
    label_singular: Projeto
    folder: content/pesquisa
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    i18n: true
    sortable_fields: [weight, title]
    fields:
      - { name: title, label: Título do projeto, widget: string, i18n: true }
      - { name: summary, label: Resumo curto (aparece no cartão), widget: text, i18n: true }
      - { name: date, label: Data, widget: datetime, type: date, format: 'YYYY-MM-DD', i18n: duplicate }
      - { name: weight, label: Ordem na página (1 = primeiro), widget: number, value_type: int, default: 10, i18n: duplicate }
      - name: image
        label: Imagem de capa
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - { name: filename, label: Imagem, widget: image, required: false, i18n: duplicate }
          - { name: caption, label: Legenda/crédito, widget: string, required: false, i18n: true }
      - { name: tags, label: Palavras-chave, widget: list, required: false, i18n: true }
      - name: links
        label: Links
        widget: list
        required: false
        i18n: duplicate
        fields:
          - name: type
            label: Tipo
            widget: select
            default: site
            options:
              - { label: Site, value: site }
              - { label: PDF, value: pdf }
              - { label: Vídeo, value: video }
              - { label: Código, value: code }
          - { name: url, label: Endereço (URL), widget: string, type: url }
      - { name: body, label: Texto da página, widget: markdown, i18n: true }

  # ──────────────────────────────────────────────────────────────────
  - name: noticias
    label: Notícias
    label_singular: Notícia
    folder: content/blog
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    i18n: true
    slug: '{{year}}-{{month}}-{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - { name: summary, label: Resumo curto, widget: string, i18n: true }
      - { name: date, label: Data, widget: datetime, type: date, format: 'YYYY-MM-DD', i18n: duplicate }
      - { name: authors, label: Autores, widget: list, default: [me], i18n: duplicate }
      - name: image
        label: Imagem de capa
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - { name: filename, label: Imagem, widget: image, required: false, i18n: duplicate }
          - { name: caption, label: Legenda/crédito, widget: string, required: false, i18n: true }
      - { name: tags, label: Palavras-chave, widget: list, required: false, i18n: true }
      - { name: body, label: Texto, widget: markdown, i18n: true }

  # ──────────────────────────────────────────────────────────────────
  # EQUIPE — português em data/authors/, inglês em data/en/authors/, espanhol em data/es/authors/
  - name: equipe
    label: Equipe (perfis)
    label_singular: Pessoa
    description: Seu perfil e o dos colaboradores. Cada pessoa é um arquivo, com versões em português, inglês e espanhol.
    folder: data/{{locale}}/authors
    extension: yaml
    format: yaml
    create: true
    i18n: true
    identifier_field: slug
    summary: '{{fields.name.display}}'
    media_folder: /assets/media/authors
    public_folder: ''
    fields:
      - { name: schema, widget: hidden, default: hugoblox/author/v1, i18n: duplicate }
      - name: slug
        label: Identificador (sem espaços)
        hint: 'Ex.: maria-souza. Use este mesmo nome no arquivo da foto. Para você, mantenha "me".'
        widget: string
        i18n: duplicate
        pattern: ['^[a-z0-9-]+$', 'Use só letras minúsculas, números e hífen']
      - { name: is_owner, label: Dono do site (só o seu perfil), widget: boolean, default: false, required: false, i18n: duplicate }
      - name: name
        label: Nome
        widget: object
        i18n: duplicate
        fields:
          - { name: display, label: Nome de exibição, widget: string }
          - { name: given, label: Prenome(s), widget: string, required: false }
          - { name: family, label: Sobrenome, widget: string, required: false }
      - { name: role, label: Cargo/função, widget: string, required: false, i18n: true }
      - { name: bio, label: Biografia, widget: text, required: false, i18n: true }
      - name: user_groups
        label: Grupo na página Equipe
        hint: 'Use o grupo no idioma de cada versão: português na PT, inglês na EN e espanhol na ES.'
        widget: select
        multiple: true
        i18n: true
        options:
          - Pesquisador responsável
          - Orientação
          - Colaboradores
          - Principal researcher
          - Supervision
          - Collaborators
          - Investigador responsable
          - Orientación
      - name: foto
        label: Foto
        hint: 'Antes de enviar, renomeie a foto para o identificador (ex.: maria-souza.jpg). Fotos quadradas ficam melhores.'
        widget: image
        required: false
        i18n: duplicate
      - name: affiliations
        label: Instituições
        widget: list
        required: false
        i18n: true
        fields:
          - { name: name, label: Nome, widget: string }
          - { name: url, label: Site, widget: string, required: false }
      - name: links
        label: Contatos e redes
        widget: list
        required: false
        i18n: duplicate
        summary: '{{fields.icon}} — {{fields.url}}'
        fields:
          - name: icon
            label: Ícone
            widget: select
            options:
              - { label: E-mail, value: at-symbol }
              - { label: LinkedIn, value: brands/linkedin }
              - { label: Instagram, value: brands/instagram }
              - { label: ORCID, value: academicons/orcid }
              - { label: Lattes, value: academicons/lattes }
              - { label: Google Acadêmico, value: academicons/google-scholar }
              - { label: ResearchGate, value: academicons/researchgate }
              - { label: GitHub, value: brands/github }
              - { label: Site, value: hero/globe-alt }
          - { name: url, label: 'Endereço (para e-mail use mailto:nome@email.com)', widget: string }
          - { name: label, label: Texto (opcional), widget: string, required: false }
      - { name: interests, label: Interesses, widget: list, required: false, i18n: true }
      - name: education
        label: Formação
        widget: list
        required: false
        i18n: true
        summary: '{{fields.degree}}'
        fields:
          - { name: degree, label: Curso, widget: string }
          - { name: institution, label: Instituição, widget: string }
          - { name: start, label: Início (AAAA-MM-DD), widget: string, required: false }
          - { name: end, label: 'Fim (AAAA-MM-DD ou texto, ex.: Concluído)', widget: string, required: false }
          - { name: summary, label: Descrição, widget: text, required: false }
      - name: experience
        label: Experiência
        widget: list
        required: false
        i18n: true
        summary: '{{fields.role}} — {{fields.org}}'
        fields:
          - { name: role, label: Função, widget: string }
          - { name: org, label: Local/organização, widget: string }
          - { name: start, label: Início (AAAA-MM-DD), widget: string, required: false }
          - { name: end, label: 'Fim (vazio = atual)', widget: string, required: false }
          - { name: summary, label: Descrição, widget: text, required: false }
      - name: skills
        label: Competências
        widget: list
        required: false
        i18n: true
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Grupo, widget: string }
          - name: items
            label: Itens
            widget: list
            fields:
              - { name: label, label: Competência, widget: string }

  # ──────────────────────────────────────────────────────────────────
  - name: paginas
    label: Páginas
    i18n: true
    files:
      # PÁGINA INICIAL — cada idioma é editado separadamente (troque o idioma no topo do editor).
      # Só os textos aparecem aqui; as configurações de layout ficam guardadas no arquivo.
      - name: inicio
        label: Página inicial
        file: content/_index.{{locale}}.md
        i18n: true
        fields:
          - { name: title, widget: hidden, i18n: true }
          - { name: date, widget: hidden, i18n: duplicate }
          - { name: type, widget: hidden, default: landing, i18n: duplicate }
          - name: sections
            label: Seções da página
            label_singular: Seção
            hint: Arraste para mudar a ordem das seções.
            widget: list
            i18n: true
            allow_add: false
            allow_remove: false
            allow_reorder: true
            typeKey: block
            types:
              - name: hero
                label: Abertura (topo da página)
                widget: object
                summary: "{{content.title}}"
                fields:
                  - name: content
                    label: Textos
                    widget: object
                    fields:
                      - name: announcement
                        label: Aviso acima do título (não aparece no celular)
                        widget: object
                        required: false
                        collapsed: true
                        fields:
                          - name: badge
                            label: Etiqueta
                            widget: object
                            required: false
                            fields:
                              - { name: text, label: Texto da etiqueta, widget: string, required: false, hint: "Ex.: Novidade" }
                              - name: color
                                label: Cor da etiqueta
                                widget: select
                                required: false
                                default: green
                                options:
                                  - { label: Verde, value: green }
                                  - { label: Azul, value: primary }
                                  - { label: Amarelo, value: amber }
                                  - { label: Rosa, value: rose }
                          - { name: text, label: Texto do aviso, widget: string, required: false, hint: Deixe vazio para esconder o aviso. }
                          - name: link
                            label: Link do aviso
                            widget: object
                            required: false
                            fields:
                              - { name: text, label: Texto do link, widget: string, required: false, hint: "Ex.: Saiba mais" }
                              - { name: url, label: Endereço, widget: string, required: false, hint: "Ex.: noticias/nome-da-noticia/ (em inglês: news/..., em espanhol: noticias/...)" }
                      - { name: eyebrow, label: Linha pequena acima do título, widget: string, required: false }
                      - { name: title, label: Título, widget: string, hint: "O trecho entre colchetes [assim] aparece colorido." }
                      - { name: text, label: Frase de apresentação, widget: text, required: false }
                      - name: primary_action
                        label: Botão principal
                        widget: object
                        fields:
                          - { name: text, label: Texto do botão, widget: string }
                          - { name: url, label: Endereço, widget: string, hint: "Ex.: pesquisa/ (inglês: research/, espanhol: investigacion/)" }
                      - name: secondary_action
                        label: Segundo link
                        widget: object
                        required: false
                        fields:
                          - { name: text, label: Texto, widget: string, required: false }
                          - { name: url, label: Endereço, widget: string, required: false, hint: "Ex.: sobre/ (inglês: about/, espanhol: sobre-mi/)" }
              - name: features
                label: Linhas de pesquisa (cartões com ícone)
                widget: object
                summary: "{{content.title}}"
                fields:
                  - name: content
                    label: Textos
                    widget: object
                    fields:
                      - { name: subtitle, label: Linha pequena acima do título, widget: string, required: false }
                      - { name: title, label: Título da seção, widget: string }
                      - { name: text, label: Frase de introdução, widget: text, required: false }
                      - name: items
                        label: Cartões
                        label_singular: Cartão
                        widget: list
                        summary: "{{name}}"
                        fields:
                          - { name: name, label: Título, widget: string }
                          - { name: description, label: Descrição, widget: text, hint: "Use *asteriscos* para itálico, como em *Fusarium*." }
                          - name: icon
                            label: Ícone
                            widget: select
                            options:
                              - { label: "Setas em círculo (reaproveitamento)", value: arrow-path }
                              - { label: "Escudo (proteção, controle)", value: shield-check }
                              - { label: "Frasco de laboratório", value: beaker }
                              - { label: "Inseto (abelhas)", value: bug-ant }
                              - { label: "Folha / brilho", value: sparkles }
                              - { label: "Planeta", value: globe-americas }
                              - { label: "Capelo (formação)", value: academic-cap }
                              - { label: "Lâmpada (ideia)", value: light-bulb }
                              - { label: "Microscópio / pesquisa", value: magnifying-glass }
                              - { label: "Gráfico", value: chart-bar }
                              - { label: "Livro", value: book-open }
                              - { label: "Pessoas", value: user-group }
              - name: collection
                label: Lista automática (notícias ou publicações)
                widget: object
                summary: "{{content.title}}"
                fields:
                  - name: content
                    label: Textos
                    widget: object
                    fields:
                      - { name: title, label: Título da seção, widget: string }
                      - { name: count, label: Quantos itens mostrar, widget: number, value_type: int, required: false, hint: Vazio = todos. }
                      - name: archive
                        label: Botão "ver todos"
                        widget: object
                        required: false
                        fields:
                          - { name: text, label: Texto do botão, widget: string, required: false }
              - name: cta-card
                label: Convite (bloco azul)
                widget: object
                summary: "{{content.title}}"
                fields:
                  - name: content
                    label: Textos
                    widget: object
                    fields:
                      - { name: title, label: Título, widget: string }
                      - { name: text, label: Texto, widget: text, required: false }
                      - name: button
                        label: Botão
                        widget: object
                        fields:
                          - { name: text, label: Texto do botão, widget: string }
                          - { name: url, label: Endereço, widget: string, hint: "Ex.: https://linktr.ee/gfspesquisa" }
              - name: markdown
                label: Texto livre
                widget: object
                summary: "{{content.title}}"
                fields:
                  - name: content
                    label: Textos
                    widget: object
                    fields:
                      - { name: title, label: Título, widget: string, required: false }
                      - { name: text, label: Texto, widget: markdown, required: false }

      - name: contato
        label: Contato
        file: content/contato.{{locale}}.md
        i18n: true
        fields:
          - { name: title, label: Título da aba, widget: string, i18n: true }
          - { name: slug, widget: hidden, i18n: true }
          - { name: date, widget: hidden, i18n: duplicate }
          - { name: type, widget: hidden, default: landing, i18n: duplicate }
          - name: sections
            label: Conteúdo
            widget: list
            i18n: true
            allow_add: false
            allow_remove: false
            allow_reorder: false
            fields:
              - { name: block, widget: hidden, default: contact-info }
              - name: content
                label: Dados de contato
                widget: object
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: subtitle, label: Subtítulo, widget: string, required: false }
                  - { name: visit_title, label: Título do bloco de endereço, widget: string, required: false }
                  - { name: connect_title, label: Título do bloco de contato, widget: string, required: false }
                  - name: address
                    label: Endereço
                    widget: object
                    fields:
                      - { name: lines, label: Linhas do endereço, widget: list }
                  - { name: email, label: E-mail, widget: string }
                  - { name: phone, label: Telefone, widget: string, required: false }
                  - name: social
                    label: Redes
                    widget: list
                    required: false
                    fields:
                      - { name: icon, label: 'Ícone (ex.: brands/linkedin)', widget: string }
                      - { name: url, label: Endereço, widget: string }
                  - { name: map_url, label: Link do mapa, widget: string, required: false }
                  - { name: show_form, widget: hidden, default: false }
